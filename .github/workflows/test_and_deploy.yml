# Runs the test matrix with uv, and publishes to PyPI with `uv publish` when a
# v* tag is pushed.

name: tests

on:
  push:
    branches:
      - main
      - npe2
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
    # A docs-only push costs the same 4-job matrix as a code change, so skip
    # it here. Deliberately not applied to pull_request: if a required status
    # check is ever added, a paths-ignore skip leaves it pending forever and
    # blocks the PR. On push there is nothing to block.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches:
      - main
      - npe2
  workflow_dispatch:

# Pushing several commits in a row used to run a full matrix for each one.
# Only the newest commit's result matters, so cancel the superseded runs --
# except on tags, where a cancelled run would abort a release upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      # Without this a single platform failure cancels the other three
      # jobs mid-run, hiding whether the failure is platform-specific.
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # uv installs the requested Python itself and caches downloaded wheels
      # keyed on uv.lock, so no separate setup-python or pip cache step.
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Free up disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          # Remove unnecessary tools and packages to free up disk space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      # Tests run Qt with QT_QPA_PLATFORM=offscreen, so the xcb libraries
      # that tlambert03/setup-qt-libs installs are never loaded. The offscreen
      # plugin needs only the runtime libraries below, which the runner image
      # already ships -- so apt is touched only if one is actually missing.
      # Calling apt unconditionally made every Linux job fail whenever the
      # Ubuntu mirror was unreachable, without a single test having run.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          missing=""
          for lib in libGL.so.1 libglib-2.0.so.0 libgthread-2.0.so.0 \
                     libfontconfig.so.1 libfreetype.so.6 libX11.so.6 \
                     libXext.so.6 libSM.so.6 libXrender.so.1 libgomp.so.1; do
            ldconfig -p | grep -q "$lib" || missing="$missing $lib"
          done
          if [ -z "$missing" ]; then
            echo "All required system libraries are present; skipping apt."
            exit 0
          fi
          echo "Missing:$missing -- installing via apt."
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libfreetype6 \
            libx11-6 \
            libxext6 \
            libsm6 \
            libxrender1 \
            libgomp1

      # --locked fails the job if uv.lock is out of date with pyproject.toml,
      # instead of silently resolving different versions than developers use.
      - name: Install dependencies
        run: uv sync --locked --group test

      # Viewer tests need an OpenGL context, so Linux runs under Xvfb (which
      # the runner image ships). This calls xvfb-run directly rather than
      # going through aganders3/headless-gui, which apt-installs xvfb and the
      # herbstluftwm window manager on every run -- no test relies on window
      # focus, and that apt call failed every Linux job whenever the Ubuntu
      # mirror was unreachable. macOS needs no virtual display.
      - name: Test
        shell: bash
        run: |
          cmd=(uv run --locked pytest --cov=napari_tmidas --cov-report=xml --timeout=300 -m "not slow" -v)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" "${cmd[@]}"
          else
            "${cmd[@]}"
          fi
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: 1
          PYTHONDONTWRITEBYTECODE: 1

      - name: Show pytest summary (if available)
        if: always()
        shell: bash
        run: |
          if [ -f coverage.xml ]; then
            echo "Found coverage.xml at repo root"
          else
            echo "No coverage.xml found (this may be fine if tests were skipped)."
            ls -al .
          fi

      - name: Coverage
        # Steps default to skipping once a prior step failed, so a red test
        # run used to skip the upload entirely and Codecov never received a
        # report at all -- which is what left the badge reading "unknown".
        # pytest-cov still writes coverage.xml when tests fail.
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          slug: MercaderLabAnatomy/napari-tmidas
          # Coverage reporting should not turn a green test run red.
          fail_ci_if_error: false

  deploy:
    # this will run when you have tagged a commit, starting with "v*"
    # and requires that you have put your PyPI API token (secret TWINE_API_KEY) in your
    # github secrets (see readme for details)
    needs: [test]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'tags')
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Build and publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TWINE_API_KEY }}
        run: |
          git tag
          uv build
          uv publish
